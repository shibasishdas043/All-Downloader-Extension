<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Downloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ═══════════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════════════ -->
  <header class="header">
    <div class="header-brand">
      <div class="brand-icon">
        <img
          id="popup-brand-icon-img"
          class="brand-icon-img"
          src="../assets/icons/icon128.png"
          srcset="../assets/icons/icon32.png 32w, ../assets/icons/icon48.png 48w, ../assets/icons/icon128.png 128w"
          sizes="32px"
          alt="All Downloader"
          width="32"
          height="32"
          loading="eager"
          decoding="async"
        />
      </div>
      <span class="brand-name">All Downloader</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-add" title="Add URL">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-dashboard" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════
       STATUS BAR
  ══════════════════════════════════════════════════ -->
  <div class="status-bar">
    <span id="status-active">0 active</span>
    <span class="dot"></span>
    <span id="status-speed">0 B/s</span>
    <span class="status-bar-right">
      <span id="status-queue">Queue: 0</span>
    </span>
  </div>

  <!-- ═══════════════════════════════════════════════
       DOWNLOAD LIST
  ══════════════════════════════════════════════════ -->
  <main class="download-list" id="download-list">
    <!-- Populated by popup.js -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2v13M7 11l5 5 5-5"/>
          <path d="M3 18h18"/>
        </svg>
      </div>
      <p class="empty-title">No active downloads</p>
      <p class="empty-sub">Click + to add a URL or browse the web</p>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════════════ -->
  <footer class="footer">
    <button class="footer-btn" id="btn-pause-all">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
      Pause All
    </button>
    <button class="footer-btn" id="btn-view-all">
      Dashboard
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </footer>

  <!-- ═══════════════════════════════════════════════
       ADD URL MODAL
  ══════════════════════════════════════════════════ -->
  <!-- ═══════════════════════════════════════════════
       ADD URL MODAL
  ══════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modal-add" hidden>
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="modal-icon-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <span class="modal-title-text">Add Download URL</span>
        </div>
        <button class="icon-btn modal-close-btn" id="modal-close" title="Close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="input-group">
          <label class="input-label" for="url-input">Source Link</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <input type="url" id="url-input" placeholder="https://example.com/file.zip" autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <div class="input-group">
          <div class="input-label-row">
            <label class="input-label" for="filename-input">Custom Filename</label>
            <span class="input-badge-optional">Optional</span>
          </div>
          <div class="input-wrapper">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <input type="text" id="filename-input" placeholder="e.g. document.pdf" autocomplete="off" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-primary" id="btn-start-download">
          <span>Start Download</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v13M7 11l5 5 5-5"/>
            <path d="M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Download item template (cloned by JS) -->
  <template id="tmpl-download-item">
    <div class="dl-item" data-id="">
      <div class="dl-item-top">
        <div class="dl-icon-wrap">
          <span class="dl-ext-badge">?</span>
        </div>
        <div class="dl-info">
          <span class="dl-name"></span>
          <span class="dl-meta"></span>
        </div>
        <div class="dl-controls">
          <!-- Pause — shown while DOWNLOADING / CONNECTING -->
          <button class="ctrl-btn ctrl-pause hidden" title="Pause">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>
          <!-- Resume — shown while PAUSED -->
          <button class="ctrl-btn ctrl-resume hidden" title="Resume">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </button>
          <!-- Show in folder — shown when COMPLETED -->
          <button class="ctrl-btn ctrl-folder hidden" title="Show in folder">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <!-- Re-download — shown when CANCELLED or ERROR -->
          <button class="ctrl-btn ctrl-retry hidden" title="Re-download">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/>
            </svg>
          </button>
          <!-- Cancel (×) — shown while download is active/queued/in-progress -->
          <button class="ctrl-btn ctrl-cancel hidden" title="Cancel download">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <!-- Trash — shown when COMPLETED, CANCELLED, or ERROR -->
          <button class="ctrl-btn ctrl-remove hidden" title="Remove from list">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="dl-progress-wrap">
        <div class="dl-progress-track">
          <div class="dl-progress-fill"></div>
          <div class="dl-progress-shimmer"></div>
        </div>
        <div class="dl-progress-labels">
          <span class="dl-speed"></span>
          <div class="dl-progress-right">
            <span class="dl-percent"></span>
            <span class="dl-eta"></span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="popup.ts" type="module"></script>
</body>
</html>
